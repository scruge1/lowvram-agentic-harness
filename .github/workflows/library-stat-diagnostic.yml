name: Library native stat diagnostic
on:
  push:
    branches: [feature/project-library-current-20261026]
    paths: [.github/workflows/library-stat-diagnostic.yml]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Compare one owned file through native path and descriptor APIs
        shell: python
        run: |
          import hashlib, json, os, sys, time
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'library-stat-diagnostic-044.txt'
          assert not target.exists()
          target.write_bytes(b'Controlled fictional native stat fixture.\r\n')
          descriptor = os.open(target, os.O_RDONLY | getattr(os, 'O_BINARY', 0))
          fields = ('st_dev', 'st_ino', 'st_mode', 'st_size', 'st_mtime_ns', 'st_ctime_ns', 'st_birthtime_ns')
          try:
              path, opened = os.lstat(target), os.fstat(descriptor)
              result = {'version': sys.version, 'source': os.environ['GITHUB_SHA'],
                        'path_stat': {k: getattr(path, k, None) for k in fields},
                        'fd_stat': {k: getattr(opened, k, None) for k in fields},
                        'same_file': os.path.samestat(path, opened),
                        'different_fields': [k for k in fields if getattr(path, k, None) != getattr(opened, k, None)]}
          finally:
              os.close(descriptor)
          sys.path.insert(0, str(Path.cwd() / 'adapters/pi/project-workflow'))
          import project_knowledge
          try:
              raw, stamp = project_knowledge._current_bytes(target, 2097152, time.monotonic() + 10)
              result['actual_source_read'] = {'ok': True, 'sha256': hashlib.sha256(raw).hexdigest()}
          except Exception as error:
              result['actual_source_read'] = {'ok': False, 'type': type(error).__name__, 'reason': str(error)}
          print('LIBRARY_NATIVE_STAT_044=' + json.dumps(result, sort_keys=True))
      - name: Inspect the actual existing fictional Library fixture
        shell: python
        run: |
          import json, os, runpy, time
          from pathlib import Path
          parent = Path(os.environ['RUNNER_TEMP']) / 'library-actual-fixture-045'
          parent.mkdir()
          os.environ['PROJECT_LIBRARY_TEST_ROOT'] = str(parent)
          module = runpy.run_path('tests/test_project_library.py')
          case = module['ProjectLibraryTests']('test_import_build_query_and_bounded_original_source_agree')
          case.setUp()
          knowledge = module['knowledge']
          fields = ('st_dev', 'st_ino', 'st_mode', 'st_size', 'st_mtime_ns', 'st_ctime_ns', 'st_birthtime_ns')
          result = {'source': os.environ['GITHUB_SHA'], 'actual_current': case.query(), 'files': []}
          try:
              for target in (case.root / '.icm/project.json', case.root / knowledge.CONFIG_PATH,
                             case.root / case.pointer['knowledge_manifest'], case.note, case.database):
                  descriptor = os.open(target, os.O_RDONLY | getattr(os, 'O_BINARY', 0))
                  try:
                      path, opened = os.lstat(target), os.fstat(descriptor)
                      row = {'name': target.name, 'same_file': os.path.samestat(path, opened),
                             'path_stat': {k: getattr(path, k, None) for k in fields},
                             'fd_stat': {k: getattr(opened, k, None) for k in fields},
                             'different_fields': [k for k in fields if getattr(path, k, None) != getattr(opened, k, None)]}
                  finally:
                      os.close(descriptor)
                  try:
                      knowledge._current_bytes(target, 2097152, time.monotonic() + 10)
                      row['actual_source_read'] = {'ok': True}
                  except Exception as error:
                      row['actual_source_read'] = {'ok': False, 'type': type(error).__name__, 'reason': str(error)}
                  result['files'].append(row)
          finally:
              case.doCleanups()
          print('LIBRARY_ACTUAL_FIXTURE_045=' + json.dumps(result, sort_keys=True))
