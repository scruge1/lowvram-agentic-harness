[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowvram-agentic-harness"
version = "0.1.0"
description = "Local-model utilities and a receipt-gated agent task supervisor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[project.scripts]
trusted-task = "harness.enforcement:main"
blessed-ssot = "ssot.cli:main"
trusted-task-integrate = "harness.integration:main"
trusted-project = "harness.project:main"
agent-home = "harness.home:main"
source-checkpoint = "harness.source_checkpoint:main"

[tool.setuptools.packages.find]
include = ["harness*", "ssot*"]

[tool.setuptools.package-data]
harness = ["templates/*.md", "templates/agent-home/**/*", "templates/agent-home/*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Preserve the rule scope of the accepted release gate across Ruff upgrades.
select = ["E4", "E7", "E9", "F"]
